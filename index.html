<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retail Management System</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Top Progress / Loading Indicator -->
  <div id="loading-bar" class="loading-bar" role="status" aria-label="Loading"></div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <div class="app-shell">
    <!-- Responsive Sidebar Navigation -->
    <aside id="sidebar" class="sidebar" aria-label="Main Navigation">
      <div class="sidebar-brand">
        <span>₹ RetailOS</span>
        <span class="badge badge-info" style="font-size:10px;">GST / POS</span>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-item active" data-view="dashboard">Dashboard</button>
        <button class="nav-item" data-view="products">Products</button>
        <button class="nav-item" data-view="inventory">Inventory</button>
        <button class="nav-item" data-view="pos">Sales / POS</button>
        <button class="nav-item" data-view="invoices">Sales Invoices</button>
        <button class="nav-item" data-view="purchases">Purchases</button>
        <button class="nav-item" data-view="customers">Customers</button>
        <button class="nav-item" data-view="suppliers">Suppliers</button>
        <button class="nav-item" data-view="expenses">Expenses</button>
        <button class="nav-item" data-view="payments">Payments</button>
        <button class="nav-item" data-view="reports">Reports</button>
        <button class="nav-item" data-view="settings">Settings</button>
      </nav>
    </aside>

    <!-- Main Workspace -->
    <div class="main-area">
      <header class="topbar">
        <div class="topbar-left">
          <button id="menu-toggle" class="menu-toggle" aria-label="Toggle Menu">&#9776;</button>
          <strong id="topbar-shop-name" style="font-size:16px;">Rang Creation <i>By Ekta</i></strong>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <span id="topbar-conn-badge" class="badge badge-warning">Connecting...</span>
          <button class="btn btn-secondary btn-sm" onclick="refreshBundle()">&#8635; Sync</button>
        </div>
      </header>

      <!-- Dynamic Module Container rendered by app.js -->
      <main id="view-container" class="content-container"></main>
    </div>
  </div>

  <!-- Reusable Accessible Modal Container -->
  <div id="modal-backdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modal-title" style="font-size:16px;font-weight:600;">Modal Title</h3>
        <button type="button" class="btn btn-secondary btn-sm" onclick="closeModal()" aria-label="Close modal">&times;</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Printable A4 Invoice / 80mm Thermal Receipt Container -->
  <div id="printable-area"></div>

  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
